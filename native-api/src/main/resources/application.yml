server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:10.0.11.171}:${DB_PORT:3306}/${DB_NAME:API_WebDeveloper}
    username: ${DB_USER:DevSebratel}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  # "Fale com seu administrador" da extensão (SuporteService): SMTP da mesma conta usada pelo DHO.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  db-schema: ${DB_NAME:API_WebDeveloper}
  # Login SSO da extensão de Chrome (ver ExtController). O client id é público, não é segredo.
  google-client-id: ${GOOGLE_CLIENT_ID:243355917213-oa2b664bbmlskjkb9losafj6a8rsbtb2.apps.googleusercontent.com}
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sebratel.com.br}
  # E-mails sempre admin (bootstrap), separados por vírgula; os demais papéis ficam em usuarios_extensao.
  admin-emails: ${ADMIN_EMAILS:}
  suporte:
    email: ${SUPPORT_EMAIL:desenvolvimento@sebratel.com.br}
    # Se definido, envia um e-mail de teste no startup (validar o SMTP de um deploy).
    teste-para: ${MAIL_TEST_TO:}
  cors-allowed-origin: ${BFF_ORIGIN:http://localhost:4002}
  # /ext/widget (ver WidgetProperties/TemposHojeJob): coluna que define "hoje" e as métricas exibidas.
  # Mesma pessoa, grafias diferentes entre Matrix e Native (ver CorrespondenciaNomes): o vínculo por
  # e-mail dá os nomes da Matrix ("Rafael da Silva - ..."), traduzidos aqui para os da Native.
  vinculo:
    outro-sistema: { tabela: db_matrix, coluna: atendente, data-coluna: data_entrada }
  widget:
    data-coluna: data_hora
    tempos:
      tma:
        hms: atendimento
        formula: Duração da conversa com o atendente (coluna atendimento da Native)
        meta-segundos: 300    # regra de produtividade Native: TMA até 5 min
      tme:
        hms: espera
        formula: Tempo aguardando na fila até ser atendido (coluna espera da Native)
        meta-segundos: 25     # TME até 25 s
    # TMEA (tempo médio entre atendimentos): do fim de uma ligação (data_hora + espera + atendimento)
    # até o atendente atender a próxima (data_hora + espera).
    tmea:
      inicio: "UNIX_TIMESTAMP(`data_hora`) + TIME_TO_SEC(`espera`)"
      fim: "UNIX_TIMESTAMP(`data_hora`) + TIME_TO_SEC(`espera`) + TIME_TO_SEC(`atendimento`)"
      formula: Início da ligação − fim da ligação anterior
      max-intervalo-minutos: 60
      dias-referencia: 30
      # Regra nova do TMEA (aba "TMEA · regra nova"): desconta pausas e tempo deslogado.
      # A Native grava pausa e sessão na mesma tabela (evento), só depois que terminam.
      pausas:
        tabela: db_native_login
        agente: agente
        inicio: data_hora_inicio
        fim: data_hora_fim
        filtro: "`evento` = 'Pausa'"
      sessoes:
        tabela: db_native_login
        agente: agente
        inicio: data_hora_inicio
        fim: data_hora_fim
        filtro: "`evento` = 'Sessão'"
    # Aba "Pausas e comportamentos": pausa e tempo previsto vêm de db_native_login (evento Pausa);
    # o tipo da pausa só existe em db_native_stops (linhas duplicadas, data_hora em texto).
    comportamento:
      pausas-sql: >-
        SELECT agente, UNIX_TIMESTAMP(data_hora_inicio) AS ini, NULLIF(UNIX_TIMESTAMP(data_hora_fim), 0) AS fim,
        NULL AS tipo, TIME_TO_SEC(tempo_previsto_pausa) AS previsto, justificativa AS motivo
        FROM db_native_login WHERE evento = 'Pausa' AND data_hora_inicio >= {desde}
      # Tipo da pausa: casado no Java por atendente + início (join no banco levava ~25 s em 30 dias).
      tipos-sql: >-
        SELECT agente, UNIX_TIMESTAMP(data_hora) AS ini, pausa AS tipo FROM db_native_stops
        WHERE data_hora >= DATE_FORMAT({desde}, '%Y-%m-%d')
      curtos-condicao: "`sentido` = 'Recebida' AND `desconexao` = 'Destino' AND TIME_TO_SEC(`atendimento`) < 10"
      curtos-rotulo: Ligações recebidas com menos de 10 s encerradas pelo atendente (desconexão = Destino)
      transferidas-condicao: "`desconexao` = 'Transferida'"
      # Ramal interno: número com até 4 dígitos (ex.: 1021).
      internas-condicao: "`sentido` = 'Efetuada' AND CHAR_LENGTH(`numero`) <= 4 AND `atendimento` IS NOT NULL"
      internas-segundos: "TIME_TO_SEC(`atendimento`)"
      # Tempo logado: a Native só grava a sessão no logoff; a sessão atual é estimada pela atividade
      # (ligações e pausas) desde o último logoff.
      estimar-sessao-aberta: true
    # Tabela "atendimentos de hoje" (/ext/widget/detalhe). Sem telefone/gravação de propósito; o
    # cliente sai só como alias (ClienteAlias — a relação alias -> nome fica em cliente_alias no app-db).
    detalhe:
      - { chave: dataHora, rotulo: Data/hora, coluna: data_hora }
      - { chave: protocolo, rotulo: Protocolo, coluna: protocolo }
      - { chave: cliente, rotulo: Cliente (alias), coluna: nome_cliente, alias: true }
      - { chave: fila, rotulo: Fila, coluna: fila }
      - { chave: sentido, rotulo: Sentido, coluna: sentido }
      - { chave: desconexao, rotulo: Desconexão, coluna: desconexao }
  group:
    name: native
    tables:
      - db_native
      - db_native_avaliations
      - db_native_login
      - db_native_stops
  # Semantic layer: same domains as matrix, but mapped to native's OWN columns (they differ).
  domains:
    atendimentos:
      titulo: Atendimentos
      descricao: Conversas e chamados recebidos pela operação.
      tabela: db_native
      unidade: atendimentos
      dimensoes:
        fila: fila
        atendente: agente
        sentido: sentido
        cidade: cidade_cliente
      # Colunas de duração ("HH:MM:SS") agregadas em média pelo endpoint /atendimentos/tempos:
      # 'espera' = tempo aguardando na fila, 'atendimento' = tempo de conversa com o agente.
      tempos:
        espera: espera
        atendimento: atendimento
    satisfacao:
      titulo: Satisfação
      descricao: Avaliações da pesquisa de satisfação respondida pelos clientes.
      tabela: db_native_avaliations
      unidade: avaliações
      notaColumn: nom_valor
      dimensoes:
        nota: nom_valor
        pergunta: nom_pergunta
        atendente: nom_agente
    pausas:
      titulo: Pausas
      descricao: Pausas dos atendentes — motivo e frequência.
      tabela: db_native_stops
      unidade: pausas
      dimensoes:
        motivo: pausa
        atendente: agente
        fila: fila
      # /pausas/duracao: o native guarda a duração como varchar "HH:MM:SS" em tempo_em_pausa;
      # 'hms' faz o TIME_TO_SEC no banco para o histograma sair em segundos.
      duracao:
        hms: tempo_em_pausa
    jornada:
      titulo: Jornada de trabalho
      descricao: Sessões e eventos de presença dos atendentes.
      tabela: db_native_login
      unidade: eventos
      dimensoes:
        atendente: agente
        evento: evento
        status: status
      # /jornada/duracao: o native não tem coluna de tempo logado; derivamos a duração da sessão
      # do intervalo entre início e fim (TIMESTAMPDIFF em segundos). Sessões abertas (fim nulo) saem.
      duracao:
        inicio: data_hora_inicio
        fim: data_hora_fim
