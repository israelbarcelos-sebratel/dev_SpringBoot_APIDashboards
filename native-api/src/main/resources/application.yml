server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:10.0.11.171}:${DB_PORT:3306}/${DB_NAME:API_WebDeveloper}
    username: ${DB_USER:DevSebratel}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  # "Fale com seu administrador" da extensão (SuporteService): SMTP da mesma conta usada pelo DHO.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  db-schema: ${DB_NAME:API_WebDeveloper}
  # Login SSO da extensão de Chrome (ver ExtController). O client id é público, não é segredo.
  google-client-id: ${GOOGLE_CLIENT_ID:243355917213-oa2b664bbmlskjkb9losafj6a8rsbtb2.apps.googleusercontent.com}
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sebratel.com.br}
  # E-mails sempre admin (bootstrap), separados por vírgula; os demais papéis ficam em usuarios_extensao.
  admin-emails: ${ADMIN_EMAILS:}
  suporte:
    email: ${SUPPORT_EMAIL:desenvolvimento@sebratel.com.br}
    # Se definido, envia um e-mail de teste no startup (validar o SMTP de um deploy).
    teste-para: ${MAIL_TEST_TO:}
  cors-allowed-origin: ${BFF_ORIGIN:http://localhost:4002}
  # /ext/widget (ver WidgetProperties/TemposHojeJob): coluna que define "hoje" e as métricas exibidas.
  widget:
    data-coluna: data_hora
    tempos:
      tma:
        hms: atendimento
        formula: Duração da conversa com o atendente (coluna atendimento da Native)
      tme:
        hms: espera
        formula: Tempo aguardando na fila até ser atendido (coluna espera da Native)
    # Tabela "atendimentos de hoje" (/ext/widget/detalhe). Sem telefone/gravação de propósito; o
    # cliente sai só como alias (ClienteAlias — a relação alias -> nome fica em cliente_alias no app-db).
    detalhe:
      - { chave: dataHora, rotulo: Data/hora, coluna: data_hora }
      - { chave: protocolo, rotulo: Protocolo, coluna: protocolo }
      - { chave: cliente, rotulo: Cliente (alias), coluna: nome_cliente, alias: true }
      - { chave: fila, rotulo: Fila, coluna: fila }
      - { chave: sentido, rotulo: Sentido, coluna: sentido }
      - { chave: desconexao, rotulo: Desconexão, coluna: desconexao }
  group:
    name: native
    tables:
      - db_native
      - db_native_avaliations
      - db_native_login
      - db_native_stops
  # Semantic layer: same domains as matrix, but mapped to native's OWN columns (they differ).
  domains:
    atendimentos:
      titulo: Atendimentos
      descricao: Conversas e chamados recebidos pela operação.
      tabela: db_native
      unidade: atendimentos
      dimensoes:
        fila: fila
        atendente: agente
        sentido: sentido
        cidade: cidade_cliente
      # Colunas de duração ("HH:MM:SS") agregadas em média pelo endpoint /atendimentos/tempos:
      # 'espera' = tempo aguardando na fila, 'atendimento' = tempo de conversa com o agente.
      tempos:
        espera: espera
        atendimento: atendimento
    satisfacao:
      titulo: Satisfação
      descricao: Avaliações da pesquisa de satisfação respondida pelos clientes.
      tabela: db_native_avaliations
      unidade: avaliações
      notaColumn: nom_valor
      dimensoes:
        nota: nom_valor
        pergunta: nom_pergunta
        atendente: nom_agente
    pausas:
      titulo: Pausas
      descricao: Pausas dos atendentes — motivo e frequência.
      tabela: db_native_stops
      unidade: pausas
      dimensoes:
        motivo: pausa
        atendente: agente
        fila: fila
      # /pausas/duracao: o native guarda a duração como varchar "HH:MM:SS" em tempo_em_pausa;
      # 'hms' faz o TIME_TO_SEC no banco para o histograma sair em segundos.
      duracao:
        hms: tempo_em_pausa
    jornada:
      titulo: Jornada de trabalho
      descricao: Sessões e eventos de presença dos atendentes.
      tabela: db_native_login
      unidade: eventos
      dimensoes:
        atendente: agente
        evento: evento
        status: status
      # /jornada/duracao: o native não tem coluna de tempo logado; derivamos a duração da sessão
      # do intervalo entre início e fim (TIMESTAMPDIFF em segundos). Sessões abertas (fim nulo) saem.
      duracao:
        inicio: data_hora_inicio
        fim: data_hora_fim
