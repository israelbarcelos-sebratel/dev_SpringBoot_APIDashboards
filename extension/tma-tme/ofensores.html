<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maiores ofensores · TMA/TME Sebratel</title>
  <link rel="icon" type="image/png" href="icons/icon32.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" />
  <style>
    /* Design system Sebratel — tokens do DHO (dho/frontend/src/styles/variables.css). Tema claro único. */
    :root {
      color-scheme: light;
      --primary-color: #ffb000;
      --primary-hover: #e09e00;
      --primary-contrast: #111111;
      --primary-soft: #fff3d6;
      --bg-color: #f5f1e8;
      --card-bg: #ffffff;
      --surface-2: #faf7ef;
      --text-color: #2a2a28;
      --text-primary: #111111;
      --text-secondary: #5e5b50;
      --border-color: #e0dacb;
      --border-subtle: #ede8db;
      --success-text: #0f7a37;
      --warning-text: #b45309;
      --warning-bg: #fff4d6;
      --warning-strong: #8a5a00;
      --error-color: #dc2626;
      --error-subtle-bg: #fce9e9;
      --no-data: #b7b2a4;
      --bg-hover: #efeadd;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 2px rgba(40, 33, 20, 0.06), 0 1px 3px rgba(40, 33, 20, 0.1);
      --focus-ring: 0 0 0 3px color-mix(in srgb, var(--primary-color) 55%, transparent);
      --overlay-primary-hover: color-mix(in srgb, var(--primary-color) 12%, transparent);
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: var(--text-color);
      background: var(--bg-color);
      -webkit-font-smoothing: antialiased;
    }
    .masthead {
      background: var(--primary-color);
      color: var(--primary-contrast);
      padding: 16px 24px;
      font-size: 15px;
      display: flex; align-items: center; gap: 10px;
    }
    .masthead img { width: 24px; height: 24px; }
    .masthead b { font-weight: 700; letter-spacing: 0.01em; }
    .masthead span { opacity: 0.72; }
    main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 40px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; color: var(--text-primary); margin: 0 0 4px; }
    .muted { color: var(--text-secondary); font-size: 13px; }
    .topbar { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input[type="search"] {
      min-width: 240px;
      padding: 9px 12px;
      font: inherit; font-size: 14px;
      color: var(--text-color);
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    input[type="search"]:focus { border-color: var(--primary-color); box-shadow: var(--focus-ring); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 16px;
      font: inherit; font-size: 14px; font-weight: 500;
      border: none; border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .btn:focus-visible { box-shadow: var(--focus-ring); outline: none; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--primary-color); color: var(--primary-contrast); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-sm); }
    .btn-secondary { background: transparent; color: var(--text-primary); border: 1px solid var(--border-color); }
    .btn-secondary:hover:not(:disabled) { background: var(--overlay-primary-hover); }

    .section-marker {
      display: flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 700; color: var(--text-primary);
      margin: 0 0 4px;
    }
    .section-marker::before {
      content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--primary-color);
    }
    .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 14px; }

    .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px 14px; }
    .kpi-label { font-size: 12px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.04em; }
    .kpi-value { font-size: 24px; font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums; margin: 2px 0 4px; }
    .kpi-formula { font-size: 12.5px; color: var(--text-color); line-height: 1.4; }
    .kpi-n { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

    .ok { color: var(--success-text); }
    .warn { color: var(--warning-text); }
    .bad { color: var(--error-color); }
    .empty { color: var(--no-data); }

    .table-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
    th {
      position: sticky; top: 0; z-index: 1;
      background: var(--surface-2);
      font-size: 12px; font-weight: 700; color: var(--text-secondary);
      cursor: pointer; user-select: none;
    }
    th:hover { color: var(--text-primary); }
    th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
    th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
    th.metric, td.metric { text-align: right; font-variant-numeric: tabular-nums; }
    th.metric { background: var(--primary-soft); color: var(--warning-strong); }
    td.metric { font-weight: 600; color: var(--text-primary); }
    td.metric.ok { color: var(--success-text); }
    td.metric.warn { color: var(--warning-text); }
    td.metric.bad { color: var(--error-color); }
    td.metric.empty { color: var(--no-data); font-weight: 400; }
    tbody tr:hover { background: var(--bg-hover); }
    td.cliente { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    tfoot td { background: var(--surface-2); font-weight: 700; color: var(--text-primary); position: sticky; bottom: 0; }

    .notice { padding: 10px 12px; border-radius: var(--radius-md); background: var(--warning-bg); color: var(--warning-strong); font-size: 13px; margin-bottom: 12px; }
    .error { padding: 10px 12px; border-radius: var(--radius-md); background: var(--error-subtle-bg); color: var(--error-color); font-size: 13px; }
    .legend { font-size: 12.5px; color: var(--text-secondary); margin: 10px 0 0; line-height: 1.5; }
    .equipe-aviso { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    .equipe-aviso[hidden] { display: none; }
    .equipe-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
    .equipe-aviso h4 { margin: 0 0 4px; font-size: 12.5px; }
    .equipe-aviso ul { margin: 0; padding-left: 18px; columns: 2 260px; column-gap: 24px; }
    .equipe-aviso li { break-inside: avoid; line-height: 1.6; }
  
    /* Tela de maiores ofensores */
    .periodos { display: flex; gap: 0; margin-top: 16px; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
    .periodo { white-space: nowrap; }
    .periodo {
      padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 600; color: var(--text-secondary);
      background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer;
    }
    .periodo:hover { color: var(--text-primary); }
    .periodo[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--primary-color); }
    .tag-teste { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--primary-soft); color: var(--warning-strong); vertical-align: 1px; }
    .chips[hidden] { display: none; }
    /* Aba da regra nova: card de regras + tabela de comparação */
    .regras h2 { font-size: 15px; margin: 0 0 10px; color: var(--text-primary); }
    .regras ol { margin: 0; padding-left: 20px; font-size: 13.5px; line-height: 1.55; color: var(--text-color); }
    .regras li { margin-bottom: 6px; }
    .regras li b { color: var(--text-primary); }
    .regras .exemplo { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--surface-2); border: 1px solid var(--border-subtle); font-size: 13px; line-height: 1.5; }
    .regras .obs { margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; }
    .regras, .nova, .pausas { grid-column: 1 / -1; min-width: 0; }
    /* Aba "Pausas e comportamentos" */
    .golpes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 4px; }
    .golpe { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 10px 12px; background: var(--surface-2); }
    .golpe h3 { margin: 0 0 4px; font-size: 13.5px; color: var(--text-primary); }
    .golpe p { margin: 0 0 4px; font-size: 12.5px; line-height: 1.45; color: var(--text-color); }
    .golpe .como { color: var(--text-secondary); }
    .golpe .limite { font-weight: 700; color: var(--warning-strong); }
    .golpe.fora { background: transparent; border-style: dashed; }
    .fontes { margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
    .fontes a { color: var(--text-secondary); }
    .pausas table { table-layout: auto; }
    .pausas td { height: 46px; }
    .pausas td.nome { min-width: 180px; max-width: 240px; }
    .pausas th.metric { white-space: nowrap; }
    .pausas td.metric.alerta { color: var(--error-color); font-weight: 700; background: var(--error-subtle-bg); }
    .alertas { display: flex; flex-wrap: wrap; gap: 4px; max-width: 260px; }
    .alerta-tag { padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--error-subtle-bg); color: var(--error-color); white-space: nowrap; }
    .expandir { all: unset; cursor: pointer; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-secondary); }
    .expandir:hover { background: var(--bg-hover); color: var(--text-primary); }
    .expandir:focus-visible { box-shadow: var(--focus-ring); }
    tr.detalhe td { height: auto; background: var(--surface-2); white-space: normal; padding: 10px 14px 14px; }
    /* A linha aberta ocupa a tabela inteira (20+ colunas): o painel fica preso na parte visível
       (largura definida no JS pela área visível da tabela) e não rola junto para o lado. */
    .detalhe-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 520px)); gap: 16px 32px;
      position: sticky; left: 14px; max-width: 1100px; align-items: start;
    }
    .detalhe-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .detalhe-grid h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--text-primary); }
    .mini { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .mini td, .mini th { padding: 4px 6px; height: auto; border-bottom: 1px solid var(--border-subtle); background: transparent; white-space: nowrap; }
    .mini th { position: static; font-size: 11.5px; }
    /* "tr.detalhe td" (white-space: normal) também pega as células daqui: por isso o ".detalhe" */
    .detalhe .mini td:first-child, .detalhe .mini th:first-child { white-space: normal; }
    .detalhe .mini td.fora { color: var(--error-color); font-weight: 700; }
    .detalhe .mini td:not(:first-child), .detalhe .mini th:not(:first-child) { text-align: right; width: 1%; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detalhe .mini.kv td:first-child { white-space: nowrap; width: 1%; padding-right: 16px; }
    .detalhe .mini.kv td:last-child { white-space: normal; width: auto; }
    .nova table { table-layout: auto; }
    .nova td { height: 50px; }
    .nova th.metric { white-space: nowrap; }
    .nova td.nome { min-width: 190px; max-width: 280px; }
    .nova td.metric.atual { color: var(--text-secondary); font-weight: 500; }
    .nova th.nova-col { background: var(--primary-color); color: var(--primary-contrast); }
    .periodo:focus-visible { box-shadow: var(--focus-ring); outline: none; border-radius: 4px 4px 0 0; }
    .filtros { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 14px; }
    .chips { display: inline-flex; gap: 6px; }
    .chip {
      padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--text-primary); background: var(--surface-2); border: 1px solid var(--border-color); cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--primary-color); border-color: var(--primary-color); color: var(--primary-contrast); }
    .chip:focus-visible { box-shadow: var(--focus-ring); outline: none; }
    .filtros label { font-size: 13px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
    .filtros select, .filtros input[type="number"] {
      padding: 6px 10px; font: inherit; font-size: 13px; color: var(--text-color); background: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: var(--radius-sm); outline: none;
    }
    .filtros input[type="number"] { width: 64px; }
    .filtros select:focus, .filtros input:focus { border-color: var(--primary-color); box-shadow: var(--focus-ring); }
    .filtros input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--primary-color); }
    /* Três cards do mesmo tamanho: colunas iguais, mesma altura, cabeçalho e linhas com altura fixa. */
    .rankings { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 0 16px; align-items: stretch; }
    .rank { display: flex; flex-direction: column; min-width: 0; }
    .rank-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
    .rank-head .section-marker { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resumo-n { font-size: 12.5px; font-weight: 700; min-height: 1.4em; }
    .rank .table-wrap { max-height: none; }
    .rank table { table-layout: fixed; }
    .rank th:nth-child(1) { width: 34px; }
    .rank th:nth-child(3) { width: 64px; }
    .rank th:nth-child(4) { width: 76px; }
    .rank th:nth-child(5) { width: 58px; }
    .rank td { height: 50px; }
    td.pos { width: 28px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    td.nome { overflow: hidden; }
    td.dif { font-weight: 500; font-size: 12.5px; }
    td.metric.n { font-weight: 400; color: var(--text-secondary); }
    .link { display: block; cursor: pointer; color: var(--text-primary); outline: none; min-width: 0; }
    .link .pessoa, .link .setor { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link .pessoa { font-weight: 500; }
    .link .setor { font-size: 11.5px; color: var(--text-secondary); }
    .link:hover .pessoa { text-decoration: underline; }
    .link:focus-visible { box-shadow: var(--focus-ring); border-radius: 3px; }
    @media (max-width: 480px) { .rankings { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="masthead"><img src="icons/icon32.png" alt="" /><div><b>Sebratel</b><span> · TMA/TME</span></div></div>

  <main>
    <div class="card">
      <div class="topbar">
        <div>
          <h1 id="titulo">Maiores ofensores · hoje</h1>
          <div class="muted" id="sub">Carregando…</div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="atualizar-btn">Atualizar</button>
        </div>
      </div>
      <div class="periodos" role="tablist" aria-label="Período">
        <button type="button" class="periodo" role="tab" data-periodo="hoje" aria-selected="true">Ofensores de hoje</button>
        <button type="button" class="periodo" role="tab" data-periodo="30d" aria-selected="false">Ofensores dos últimos 30 dias</button>
        <button type="button" class="periodo" role="tab" data-periodo="nova" aria-selected="false">TMEA · regra nova <span class="tag-teste">em teste</span></button>
        <button type="button" class="periodo" role="tab" data-periodo="pausas" aria-selected="false">Pausas e comportamentos</button>
      </div>
      <div class="filtros">
        <span class="chips" role="group" aria-label="Período da regra nova" id="nova-periodos" hidden>
          <button type="button" class="chip" data-nova="hoje" aria-pressed="true">Hoje</button>
          <button type="button" class="chip" data-nova="30d" aria-pressed="false">Últimos 30 dias</button>
        </span>
        <span class="chips" role="group" aria-label="Sistema">
          <button type="button" class="chip" data-sistema="native" aria-pressed="true">Native</button>
          <button type="button" class="chip" data-sistema="matrix" aria-pressed="false">Matrix</button>
        </span>
        <label>Setor <select id="setor"><option value="">Todos os setores</option></select></label>
        <label id="turno-filtro">Turno <select id="turno"><option value="">Todos os turnos</option></select></label>
        <label id="supervisor-filtro" hidden>Supervisão <select id="supervisor"><option value="">Todas as supervisões</option></select></label>
        <label title="Esconde quem teve poucos atendimentos no período (uma ligação longa não faz de ninguém um ofensor)">
          Mínimo de atendimentos <input type="number" id="minimo" min="1" value="3" />
        </label>
        <label><input type="checkbox" id="todos" /> Mostrar todos (não só os 10 piores)</label>
      </div>
      <p class="legend" id="legenda"></p>
    </div>

    <div class="card equipe-aviso" id="equipe-aviso" hidden></div>
    <div class="rankings" id="rankings"></div>
  </main>

  <script src="api.js"></script>
  <script src="ofensores.js"></script>
</body>
</html>
