server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:10.0.11.171}:${DB_PORT:3306}/${DB_NAME:API_WebDeveloper}
    username: ${DB_USER:DevSebratel}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

app:
  db-schema: ${DB_NAME:API_WebDeveloper}
  # Login SSO da extensão de Chrome (ver ExtController). O client id é público, não é segredo.
  google-client-id: ${GOOGLE_CLIENT_ID:243355917213-oa2b664bbmlskjkb9losafj6a8rsbtb2.apps.googleusercontent.com}
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sebratel.com.br}
  # E-mails sempre admin (bootstrap), separados por vírgula; os demais papéis ficam em usuarios_extensao.
  admin-emails: ${ADMIN_EMAILS:}
  cors-allowed-origin: ${BFF_ORIGIN:http://localhost:4001}
  # /ext/widget: coluna que define "hoje" em atendimentos (ver TemposHojeJob). Em db_matrix é
  # varchar 'YYYY-MM-DD HH:MM:SS' (a tabela não tem coluna DATETIME).
  widget:
    data-coluna: data_entrada
  group:
    name: matrix
    tables:
      - db_matrix
      - db_matrix_login
      - db_matrix_avaliations
      - db_matrix_stops
  # Semantic layer: maps each business domain to its data set and dimension columns.
  # This is the only place internal column names live; routes/responses stay in business language.
  domains:
    atendimentos:
      titulo: Atendimentos
      descricao: Conversas e chamados recebidos pela operação.
      tabela: db_matrix
      unidade: atendimentos
      dimensoes:
        canal: canal
        servico: servico
        atendente: atendente
        ativoReceptivo: ativo_receptivo
        tempoFila: tempo_fila
        tmic: tmic
        tmia: tmia
      # Colunas de duração ("HH:MM:SS") agregadas em média pelo endpoint /atendimentos/tempos.
      tempos:
        tempoFila: tempo_fila
        tmic: tmic
        tmia: tmia
    satisfacao:
      titulo: Satisfação
      descricao: Avaliações da pesquisa de satisfação respondida pelos clientes.
      tabela: db_matrix_avaliations
      unidade: avaliações
      notaColumn: nom_valor
      dimensoes:
        nota: nom_valor
        pergunta: nom_pergunta
    pausas:
      titulo: Pausas
      descricao: Pausas dos atendentes — motivo, duração e frequência.
      tabela: db_matrix_stops
      unidade: pausas
      dimensoes:
        motivo: pausa
        atendente: agente
        duracaoSegundos: seg_pausado
      # Histograma de /pausas/duracao: seg_pausado já é a duração em segundos inteiros.
      duracao:
        segundos: seg_pausado
    jornada:
      titulo: Jornada de trabalho
      descricao: Sessões de trabalho dos atendentes — login, logout e tempo conectado.
      tabela: db_matrix_login
      unidade: sessões
      dimensoes:
        atendente: agente
        duracaoSegundos: seg_logado
      # Histograma de /jornada/duracao: seg_logado já é o tempo conectado em segundos inteiros.
      duracao:
        segundos: seg_logado
