server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:10.0.11.171}:${DB_PORT:3306}/${DB_NAME:API_WebDeveloper}
    username: ${DB_USER:DevSebratel}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  # "Fale com seu administrador" da extensão (SuporteService): SMTP da mesma conta usada pelo DHO.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  db-schema: ${DB_NAME:API_WebDeveloper}
  # Login SSO da extensão de Chrome (ver ExtController). O client id é público, não é segredo.
  google-client-id: ${GOOGLE_CLIENT_ID:243355917213-oa2b664bbmlskjkb9losafj6a8rsbtb2.apps.googleusercontent.com}
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sebratel.com.br}
  # E-mails sempre admin (bootstrap), separados por vírgula; os demais papéis ficam em usuarios_extensao.
  admin-emails: ${ADMIN_EMAILS:}
  # Planilha da equipe do suporte (turno e supervisor), enviada pelo n8n uma vez por dia em
  # PUT /interno/equipe com este token no header X-Equipe-Token (ver EquipeController). Vazio = desligado.
  equipe:
    token: ${EQUIPE_TOKEN:}
  suporte:
    email: ${SUPPORT_EMAIL:desenvolvimento@sebratel.com.br}
    # Se definido, envia um e-mail de teste no startup (validar o SMTP de um deploy).
    teste-para: ${MAIL_TEST_TO:}
  cors-allowed-origin: ${BFF_ORIGIN:http://localhost:4001}
  # /ext/widget (ver WidgetProperties/TemposHojeJob): coluna que define "hoje" e as métricas exibidas.
  # Em db_matrix as datas são varchar 'YYYY-MM-DD HH:MM:SS' (a tabela não tem coluna DATETIME), e não
  # há colunas prontas de TMA/TME (tempo_fila vem quase sempre vazio): derivamos das datas.
  #   TMA = assumiu o atendimento -> finalizou;  TME = entrou na fila -> agente assumiu (sem o tempo no bot).
  # Mesma pessoa, grafias diferentes entre Matrix e Native (ver CorrespondenciaNomes): nomes que
  # chegam da Native (lista "Ver dados de" do admin) são traduzidos para os da Matrix.
  vinculo:
    outro-sistema: { tabela: db_native, coluna: agente, data-coluna: data_hora }
  widget:
    data-coluna: data_entrada
    tempos:
      tma:
        inicio: data_atendimento
        fim: data_finalizacao
        formula: Finalização − início do atendimento
        meta-segundos: 1800   # regra de produtividade Matrix: TMA até 30 min
      tme:
        inicio: data_fila
        fim: data_atendimento
        formula: Início do atendimento − entrada na fila
        meta-segundos: 45     # TME até 45 s
      # Tempos de interação que a Matrix já calcula ("HH:MM:SS").
      tmic:
        hms: tmic
        formula: Tempo médio de interação do cliente (calculado pela Matrix)
      tmia:
        hms: tmia
        formula: Tempo médio de interação do atendente (calculado pela Matrix)
    # TMEA (tempo médio entre atendimentos). No chat o atendente toca vários atendimentos ao mesmo
    # tempo e só finaliza horas depois, então não dá para medir a ausência a partir do fim: medimos
    # de assumir um atendimento até assumir o próximo.
    tmea:
      inicio: "UNIX_TIMESTAMP(NULLIF(`data_atendimento`, ''))"
      fim: "UNIX_TIMESTAMP(NULLIF(`data_atendimento`, ''))"
      formula: Início do atendimento − início do atendimento anterior (no chat os atendimentos correm em paralelo)
      max-intervalo-minutos: 60
      dias-referencia: 30
      # Regra nova do TMEA (aba "TMEA · regra nova"): desconta pausas e tempo deslogado.
      pausas:
        tabela: db_matrix_stops
        agente: agente
        inicio: data_pausa
        fim: data_despausa
      sessoes:
        tabela: db_matrix_login
        agente: agente
        inicio: data_login
        fim: data_logout
    # CSAT (satisfação) do widget: média da nota 1–5 da pesquisa respondida pelo cliente, hoje e nos
    # últimos `dias`. nom_agente tem a mesma grafia de db_matrix.atendente. A pesquisa tem duas
    # perguntas (atendente e resolução do problema); só a do atendente mede o atendente. Tire o filtro
    # para fazer a média das duas. Só na Matrix: na Native os dados da pesquisa não estão corretos.
    csat:
      tabela: db_matrix_avaliations
      agente: nom_agente
      data: dat_resposta
      nota: nom_valor
      filtro: "`nom_pergunta` LIKE '%atendimento da pessoa%'"
      formula: Média das notas (1 a 5) da pesquisa sobre o atendente
      satisfeito-minimo: 4
      dias: 30
      # Nota de cada atendimento na tabela de detalhes: cod_atendimento = db_matrix.codigo.
      atendimento: cod_atendimento
      atendimento-chamada: codigo
    # Aba "Pausas e comportamentos". A Matrix não tem tempo previsto por pausa e grava
    # "0000-00-00 00:00:00" quando o fim da pausa não foi registrado.
    comportamento:
      pausas-sql: >-
        SELECT agente, UNIX_TIMESTAMP(data_pausa) AS ini, NULLIF(UNIX_TIMESTAMP(data_despausa), 0) AS fim,
        pausa AS tipo, NULL AS previsto, NULL AS motivo FROM db_matrix_stops WHERE data_pausa >= {desde}
      curtos-condicao: "TIMESTAMPDIFF(SECOND, NULLIF(`data_atendimento`, ''), NULLIF(`data_finalizacao`, '')) BETWEEN 0 AND 59"
      curtos-rotulo: Atendimentos finalizados em menos de 1 min depois de assumidos
      tipo-prefixo: '^[0-9]+-SEBRATEL-'
      # Chats ficam abertos por horas em paralelo: atendimento longo não indica linha presa.
      longas-ativo: false
    # Tabela "atendimentos de hoje" (/ext/widget/detalhe). Sem CPF/telefone de propósito; o cliente
    # sai só como alias (ClienteAlias — a relação alias -> nome fica na tabela cliente_alias do app-db).
    detalhe:
      - { chave: protocolo, rotulo: Protocolo, coluna: protocolo }
      - { chave: cliente, rotulo: Cliente (alias), coluna: contato, alias: true }
      - { chave: canal, rotulo: Canal, coluna: canal }
      - { chave: servico, rotulo: Serviço, coluna: servico }
      - { chave: entrada, rotulo: Entrada, coluna: data_entrada }
      - { chave: fila, rotulo: Entrou na fila, coluna: data_fila }
      - { chave: atendimento, rotulo: Início do atendimento, coluna: data_atendimento }
      - { chave: finalizacao, rotulo: Finalização, coluna: data_finalizacao }
  group:
    name: matrix
    tables:
      - db_matrix
      - db_matrix_login
      - db_matrix_avaliations
      - db_matrix_stops
  # Semantic layer: maps each business domain to its data set and dimension columns.
  # This is the only place internal column names live; routes/responses stay in business language.
  domains:
    atendimentos:
      titulo: Atendimentos
      descricao: Conversas e chamados recebidos pela operação.
      tabela: db_matrix
      unidade: atendimentos
      dimensoes:
        canal: canal
        servico: servico
        atendente: atendente
        ativoReceptivo: ativo_receptivo
        tempoFila: tempo_fila
        tmic: tmic
        tmia: tmia
      # Colunas de duração ("HH:MM:SS") agregadas em média pelo endpoint /atendimentos/tempos.
      tempos:
        tempoFila: tempo_fila
        tmic: tmic
        tmia: tmia
    satisfacao:
      titulo: Satisfação
      descricao: Avaliações da pesquisa de satisfação respondida pelos clientes.
      tabela: db_matrix_avaliations
      unidade: avaliações
      notaColumn: nom_valor
      dimensoes:
        nota: nom_valor
        pergunta: nom_pergunta
    pausas:
      titulo: Pausas
      descricao: Pausas dos atendentes — motivo, duração e frequência.
      tabela: db_matrix_stops
      unidade: pausas
      dimensoes:
        motivo: pausa
        atendente: agente
        duracaoSegundos: seg_pausado
      # Histograma de /pausas/duracao: seg_pausado já é a duração em segundos inteiros.
      duracao:
        segundos: seg_pausado
    jornada:
      titulo: Jornada de trabalho
      descricao: Sessões de trabalho dos atendentes — login, logout e tempo conectado.
      tabela: db_matrix_login
      unidade: sessões
      dimensoes:
        atendente: agente
        duracaoSegundos: seg_logado
      # Histograma de /jornada/duracao: seg_logado já é o tempo conectado em segundos inteiros.
      duracao:
        segundos: seg_logado
