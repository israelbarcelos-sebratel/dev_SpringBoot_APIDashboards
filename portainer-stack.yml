# Stack para o Portainer — builda as 2 APIs Java EM TEMPO DE DEPLOY.
#
# REQUISITOS:
#   - Deploy pelo método "Repository" (o Portainer clona o repo e executa o build).
#     O "Web editor" NÃO builda; Docker Swarm NÃO builda — use Docker standalone.
#   - As variáveis ${...} são preenchidas na aba "Environment variables" da stack.
#     NÃO comite senha aqui.
#   - APP_DB_PASSWORD é obrigatória: senha do banco próprio da aplicação (app-db), criado vazio no
#     primeiro deploy (volume app-db-data). As tabelas são criadas pelas APIs no startup. Não troque
#     a senha depois do primeiro deploy — o MariaDB só a lê ao inicializar um volume novo.
#   - MAIL_USERNAME/MAIL_PASSWORD: conta SMTP (a mesma do DHO) do "Fale com seu administrador" da
#     extensão. MAIL_TEST_TO (opcional) envia um e-mail de teste no startup — deixe vazio depois.

x-app-db-env: &app-db-env
  APP_DB_HOST: app-db
  APP_DB_PORT: "3306"
  APP_DB_NAME: "${APP_DB_NAME:-sebratel_app}"
  APP_DB_USER: "${APP_DB_USER:-sebratel_app}"
  APP_DB_PASSWORD: "${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}"

x-mail-env: &mail-env
  MAIL_HOST: "${MAIL_HOST:-smtp.gmail.com}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  SUPPORT_EMAIL: "${SUPPORT_EMAIL:-desenvolvimento@sebratel.com.br}"
  MAIL_TEST_TO: "${MAIL_TEST_TO:-}"

services:
  app-db:
    image: mariadb:11.4
    container_name: apis-app-db
    environment:
      MARIADB_DATABASE: "${APP_DB_NAME:-sebratel_app}"
      MARIADB_USER: "${APP_DB_USER:-sebratel_app}"
      MARIADB_PASSWORD: "${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      TZ: America/Sao_Paulo
    volumes:
      - app-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  matrix-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: matrix-api
        PORT: "8091"
    image: matrix-api:local
    # Imagem só existe no host (build local): o compose nunca deve tentar baixá-la de um registro,
    # mesmo com "Re-pull image" ligado no Portainer.
    pull_policy: build
    container_name: matrix-api
    ports:
      - "8091:8091"
    environment:
      SERVER_PORT: "8091"
      BFF_ORIGIN: "${MATRIX_BFF_ORIGIN:-http://localhost:4001}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      <<: [*app-db-env, *mail-env]
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

  native-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: native-api
        PORT: "8092"
    image: native-api:local
    # Imagem só existe no host (build local): o compose nunca deve tentar baixá-la de um registro,
    # mesmo com "Re-pull image" ligado no Portainer.
    pull_policy: build
    container_name: native-api
    ports:
      - "8092:8092"
    environment:
      SERVER_PORT: "8092"
      BFF_ORIGIN: "${NATIVE_BFF_ORIGIN:-http://localhost:4002}"
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      <<: [*app-db-env, *mail-env]
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

  # Análise diária das ligações (regra Mute / "linha com problema"): baixa as gravações, transcreve com Whisper
  # LOCAL (o áudio não sai do servidor), aplica as regras e grava no app-db. Quem dispara é o workflow do n8n
  # (n8n/analise-ligacoes.json), pela rede do n8n: http://analise-ligacoes:8000. Sem porta publicada.
  # Opcionais na stack: ANALISE_TOKEN (exige o header X-Token), ANALISE_WORKERS/THREADS/MODELO, ANALISE_RETENCAO_DIAS.
  # Histórico (n8n/historico-conversas.json): todas as ligações, transcrição completa + IA, um dia por vez.
  #   GEMINI_API_KEY é obrigatória para o histórico (digite na aba Environment variables da stack; NÃO comite).
  #   Só o TEXTO mascarado vai para o Gemini; o áudio é apagado logo depois de transcrito, nada de áudio fica guardado.
  analise-ligacoes:
    build:
      context: ./analise-ligacoes
    image: analise-ligacoes:local
    pull_policy: build
    container_name: analise-ligacoes
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      <<: *app-db-env
      ANALISE_TOKEN: "${ANALISE_TOKEN:-}"
      # 1 worker: cada Whisper "medium" ocupa ~2,5–3 GB aqui; com 2 o container batia no limite de memória e o
      # sistema matava o worker (30/09). Com 1 worker o dia leva ~6 h (roda de madrugada).
      WORKERS: "${ANALISE_WORKERS:-1}"
      THREADS: "${ANALISE_THREADS:-6}"
      MODELO: "${ANALISE_MODELO:-medium}"
      RETENCAO_DIAS: "${ANALISE_RETENCAO_DIAS:-90}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODELO: "${GEMINI_MODELO:-gemini-3.8-flash}"
      MODELO_HISTORICO: "${HISTORICO_MODELO:-small}"     # small: ~2x mais rápido que o medium, qualidade parecida
      THREADS_HISTORICO: "${HISTORICO_THREADS:-6}"
      HISTORICO_DESDE: "${HISTORICO_DESDE:-}"            # vazio = desde o 1º dia do db_native (dias sem gravação são pulados)
      IA_PARALELO: "${HISTORICO_IA_PARALELO:-4}"
    volumes:
      - whisper-modelos:/modelos   # modelo do Whisper (~1,5 GB, baixado no primeiro uso)
    # O servidor é dividido com as APIs e outros ~45 containers: o n8n roda de madrugada e isto fica limitado.
    cpus: 6
    mem_limit: 6g
    # Prioridade menor que a das APIs (padrão 1024): com o histórico rodando o dia todo, native-api e matrix-api
    # sempre ganham a CPU quando precisam.
    cpu_shares: 256
    networks:
      - default
      - n8n
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Rede onde estão o n8n e o n8n-worker (stack "redis"/"n8n").
  n8n:
    external: true
    name: redis-alpine-net

volumes:
  app-db-data:
  whisper-modelos:
