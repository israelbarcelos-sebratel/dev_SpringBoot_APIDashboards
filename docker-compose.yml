# Sobe as APIs Java localmente. Portas internas dos containers seguem 8091/8092 (mesmo
# valor usado em produção), mas o mapeamento de porta NO HOST é 18091/18092 — 8091 já está
# ocupada nesta máquina por outro serviço (radar-frota-api, ver `docker ps`).
#   matrix-api -> host 18091 (container 8091)   |   native-api -> host 18092 (container 8092)
#
# Credenciais e host do banco vêm de um arquivo .env (NÃO versionado).
# Copie o modelo antes de subir:
#   cp .env.example .env   # e preencha DB_PASSWORD
#   docker compose up -d --build
#
# Para subir só uma das APIs:
#   docker compose up -d --build matrix-api
#
# Dois bancos: os dados da Native/Matrix são LIDOS do MariaDB compartilhado (DB_*); o que a
# aplicação ESCREVE (usuários da extensão e cache de tempos) fica no app-db abaixo, com volume
# próprio. As tabelas do app-db são criadas pelas APIs no startup (common/.../app-schema.sql).

x-app-db-env: &app-db-env
  APP_DB_HOST: app-db
  APP_DB_PORT: "3306"
  APP_DB_NAME: "${APP_DB_NAME:-sebratel_app}"
  APP_DB_USER: "${APP_DB_USER:-sebratel_app}"
  APP_DB_PASSWORD: "${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}"

services:
  app-db:
    image: mariadb:11.4
    container_name: apis-app-db
    environment:
      MARIADB_DATABASE: "${APP_DB_NAME:-sebratel_app}"
      MARIADB_USER: "${APP_DB_USER:-sebratel_app}"
      MARIADB_PASSWORD: "${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      TZ: America/Sao_Paulo
    volumes:
      - app-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  matrix-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: matrix-api
        PORT: "8091"
    image: matrix-api:local
    container_name: matrix-api
    ports:
      - "18091:8091"
    env_file: .env
    environment:
      SERVER_PORT: "8091"
      BFF_ORIGIN: "${MATRIX_BFF_ORIGIN:-http://localhost:4001}"
      <<: *app-db-env
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

  native-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: native-api
        PORT: "8092"
    image: native-api:local
    container_name: native-api
    ports:
      - "18092:8092"
    env_file: .env
    environment:
      SERVER_PORT: "8092"
      BFF_ORIGIN: "${NATIVE_BFF_ORIGIN:-http://localhost:4002}"
      <<: *app-db-env
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-db-data:
