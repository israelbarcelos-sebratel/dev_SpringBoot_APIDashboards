name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Menor privilégio: o CI só lê o repositório.
permissions:
  contents: read

# Push novo cancela o run anterior da mesma branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # o mesmo da imagem eclipse-temurin:21
          cache: maven
      - name: Testes e build
        run: mvn -B verify

  imagem:
    name: Imagem Docker (matrix-api e native-api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Mesmo Dockerfile e build args que o Portainer usa (portainer-stack.yml): um Dockerfile quebrado
      # (ex.: COPY de um arquivo que não existe, como o extension/tma-tme.crx) aparece no PR, não no deploy.
      - name: Construir matrix-api
        run: docker build --build-arg MODULE=matrix-api --build-arg PORT=8091 -t matrix-api:ci .
      - name: Construir native-api
        run: docker build --build-arg MODULE=native-api --build-arg PORT=8092 -t native-api:ci .
      - name: O CRX está na imagem
        run: docker run --rm --entrypoint ls native-api:ci -l /app/extension-crx/tma-tme.crx

  # Check único para a proteção de branch. `if: always()` no job, senão ele é pulado quando
  # um `needs` falha e o check nunca reporta.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [backend, imagem]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Resultado agregado
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Pelo menos um job não passou."; exit 1
          fi
          echo "Tudo verde."
